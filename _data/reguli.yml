reguli:
  - text: "In salon nu se foloseste niciun fel de anestezic, deci nu primim caini foarte agitati sau agresivi."
  - text: "Nu toaletam caini cu probleme dermatologice sau femele gestante."
  - text: "Cainii cu probleme de sanatate care pot ingreuna toaletarea in siguranta sunt directionati catre un cabinet veterinar."
  - text: "Toaletajul dureaza intre 1 h 30 min si 3 h, in functie de rasa, tipul si starea blanii si de comportamentul cainelui."
