media:
  - name: galerie
    label: Poze galerie
    input: img/galerie
    output: img/galerie
    extensions: [webp, jpg, jpeg, png]
    rename: safe

content:
  - name: galerie
    label: Galerie
    type: file
    path: galerie.json
    format: json
    fields:
      - name: poze
        label: Poze
        type: object
        list: true
        fields:
          - name: src
            label: Poza
            type: image
            options:
              media: galerie
          - name: alt
            label: Descriere poza
            type: string
          - name: legenda
            label: Legenda (optional)
            type: string
          - name: w
            label: Latime (px)
            type: number
          - name: h
            label: Inaltime (px)
            type: number

  - name: preturi
    label: Preturi
    type: file
    path: _data/preturi.yml
    format: yaml
    fields:
      - name: complet
        label: Pachet complet (lei)
        type: object
        fields:
          - {name: descriere, label: Descriere (ce include), type: text}
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}
      - name: spalat
        label: Doar spalat (lei)
        type: object
        fields:
          - {name: descriere, label: Descriere (ce include), type: text}
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}
      - name: tuns
        label: Doar tuns (lei)
        type: object
        fields:
          - {name: descriere, label: Descriere (ce include), type: text}
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}

  - name: salon
    label: Telefon si program
    type: file
    path: _data/salon.yml
    format: yaml
    fields:
      - name: telefon
        label: Telefon afisat (ex. 0791 140 396)
        type: string
      - name: telefon_intl
        label: Telefon pentru link-uri (ex. +40791140396)
        type: string
      - name: program
        label: Program
        type: object
        fields:
          - {name: luni_vineri_de, label: "Luni-Vineri: deschidere (HH:MM, ex. 09:00)", type: string}
          - {name: luni_vineri_pana, label: "Luni-Vineri: inchidere (HH:MM, ex. 17:00)", type: string}
          - {name: sambata_de, label: "Sambata: deschidere (HH:MM)", type: string}
          - {name: sambata_pana, label: "Sambata: inchidere (HH:MM)", type: string}
