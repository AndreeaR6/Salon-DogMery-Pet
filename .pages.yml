media:
  - name: galerie
    label: Poze galerie
    input: img/galerie
    output: img/galerie
    extensions: [webp, jpg, jpeg, png]
    rename: safe
  - name: clipuri
    label: Clipuri video
    input: video
    output: video
    extensions: [mp4, webm]
    rename: safe
  - name: imagini
    label: Imagini site
    input: img/site
    output: img/site
    extensions: [webp, jpg, jpeg, png, svg]
    rename: safe

content:
  - name: galerie
    label: Galerie
    type: file
    path: galerie.json
    format: json
    fields:
      - name: poze
        label: Poze
        type: object
        list: true
        fields:
          - name: src
            label: Poza
            type: image
            options:
              media: galerie
          - name: alt
            label: Descriere poza
            type: string
          - name: legenda
            label: Legenda (optional)
            type: string
          - name: w
            label: Latime (px)
            type: number
          - name: h
            label: Inaltime (px)
            type: number

  - name: preturi
    label: Preturi
    type: file
    path: _data/preturi.yml
    format: yaml
    fields:
      - name: complet
        label: Pachet complet (lei)
        type: object
        fields:
          - {name: descriere, label: Descriere (ce include), type: text}
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}
      - name: spalat
        label: Doar spalat (lei)
        type: object
        fields:
          - {name: descriere, label: Descriere (ce include), type: text}
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}
      - name: tuns
        label: Doar tuns (lei)
        type: object
        fields:
          - {name: descriere, label: Descriere (ce include), type: text}
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}

  - name: salon
    label: Telefon si program
    type: file
    path: _data/salon.yml
    format: yaml
    fields:
      - name: telefon
        label: Telefon afisat (ex. 0791 140 396)
        type: string
      - name: telefon_intl
        label: Telefon pentru link-uri (ex. +40791140396)
        type: string
      - name: program
        label: Program
        type: object
        fields:
          - {name: luni_vineri_de, label: "Luni-Vineri: deschidere (HH:MM, ex. 09:00)", type: string}
          - {name: luni_vineri_pana, label: "Luni-Vineri: inchidere (HH:MM, ex. 17:00)", type: string}
          - {name: sambata_de, label: "Sambata: deschidere (HH:MM)", type: string}
          - {name: sambata_pana, label: "Sambata: inchidere (HH:MM)", type: string}
      - {name: strada, label: "Adresa: strada si numar", type: string}
      - {name: detalii_adresa, label: "Adresa: bloc, scara, parter", type: string}
      - {name: oras, label: Oras, type: string}
      - {name: cod_postal, label: "Cod postal", type: string}
      - name: retele
        label: "Retele sociale (trage de ⋮⋮ ca sa schimbi ordinea; bifa 'Arata' ca sa o ascunzi)"
        type: block
        list:
          collapsible:
            collapsed: false
            summary: "{index}. {tip}"
        blockKey: tip
        blocks:
          - name: facebook
            fields:
              - {name: link, label: "Link Facebook (complet, cu https://)", type: string}
              - {name: afiseaza, label: "Arata pe site", type: boolean}
          - name: instagram
            fields:
              - {name: link, label: "Link Instagram (complet, cu https://)", type: string}
              - {name: afiseaza, label: "Arata pe site", type: boolean}
          - name: tiktok
            fields:
              - {name: link, label: "Link TikTok (complet, cu https://)", type: string}
              - {name: afiseaza, label: "Arata pe site", type: boolean}
      - {name: text_subsol, label: "Text scurt din subsolul paginilor", type: string}

  - name: video
    label: Clipuri video
    type: file
    path: _data/video.yml
    format: yaml
    fields:
      - name: clipuri
        label: Clipuri
        type: object
        list: true
        fields:
          - {name: titlu, label: "Titlu (optional)", type: string}
          - {name: link, label: "Link complet TikTok / Facebook / Instagram (copiat din browser)", type: string}
          - name: fisier
            label: "SAU fisier video incarcat (mp4 sau webm, sub 25 MB)"
            type: file
            options: {media: clipuri}
          - name: poza
            label: "Coperta pentru fisier (optional)"
            type: image
            options: {media: galerie}
          - {name: contact, label: "Arata si pe pagina Contact (bifat = apare si acolo; mereu apare in Galerie)", type: boolean}
          - {name: peste_tot, label: "Arata pe TOATE paginile (pagina principala, Servicii, Despre noi, Contact; in Galerie apare mereu)", type: boolean}

  - name: recenzii
    label: Recenzii (Ce spun clientii)
    type: file
    path: _data/recenzii.yml
    format: yaml
    fields:
      - {name: nota, label: "Nota pe Google (ex. 4,9)", type: string}
      - {name: numar, label: "Numar de recenzii", type: number}
      - {name: luna, label: "Luna si anul notei (ex. octombrie 2026)", type: string}
      - {name: link, label: "Link catre recenziile de pe Google Maps", type: string}
      - name: recenzii
        label: Recenzii afisate pe site
        type: object
        list: true
        fields:
          - {name: text, label: "Textul recenziei (fara ghilimele)", type: text}
          - {name: autor, label: "Autor (ex. M. U., recenzie Google)", type: string}

  - name: campanie
    label: Campanie (Secret Santa)
    type: file
    path: _data/campanie.yml
    format: yaml
    fields:
      - {name: afisata, label: "Afiseaza campania pe site (pagina principala si Despre noi)", type: boolean}
      - name: imagine
        label: "Imaginea din dreptul textului (svg, png sau webp)"
        type: image
        options: {media: imagini}
      - {name: eticheta, label: "Eticheta mica de deasupra titlului", type: string}
      - {name: titlu, label: Titlu, type: string}
      - {name: text, label: Text, type: text}

  - name: faq
    label: Intrebari frecvente
    type: file
    path: _data/faq.yml
    format: yaml
    fields:
      - name: intrebari
        label: Intrebari
        type: object
        list: true
        fields:
          - {name: intrebare, label: Intrebare, type: string}
          - {name: raspuns, label: "Raspuns (poti scrie [preturi] pentru textul cu preturile si [telefon] pentru numarul de telefon, se completeaza automat)", type: text}
          - {name: pe_prima_pagina, label: "Arata si pe pagina principala (pe Servicii apar toate)", type: boolean}

  - name: acasa
    label: Pagina principala (texte, sectiuni, culori)
    type: file
    path: _data/acasa.yml
    format: yaml
    fields:
      - {name: titlu, label: "Titlu mare", type: string}
      - {name: lead, label: "Text sub titlu", type: text}
      - {name: servicii_titlu, label: "Ce face salonul: titlul sectiunii", type: string}
      - {name: servicii_text, label: "Ce face salonul: text sub titlu", type: text}
      - name: servicii
        label: "Ce face salonul: lista (pictogramele se pun automat, in ordine)"
        type: object
        list: true
        fields:
          - {name: titlu, label: Titlu, type: string}
          - {name: text, label: Text, type: text}
      - {name: pasi_titlu, label: "Cum decurge o programare: titlul sectiunii", type: string}
      - name: pasi
        label: "Cum decurge o programare: pasii (poti scrie [telefon] pentru numarul de telefon)"
        type: object
        list: true
        fields:
          - {name: titlu, label: Titlu, type: string}
          - {name: text, label: Text, type: text}
      - name: sectiuni
        label: "Sectiuni pagina (trage de ⋮⋮ ca sa le muti; sterge ca sa le ascunzi; 'Add' ca sa adaugi) - pagina principala"
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {tip} {titlu}"
        blockKey: tip
        blocks:
          - name: servicii
            fields:
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: inainte_dupa
            fields:
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: preturi
            fields:
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: pasi
            fields:
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: recenzii
            fields:
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: intrebari
            fields:
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: poza_mare
            fields:
              - {name: poza, label: "Poza (gol = bannerul principal din 'Imagini principale')", type: image, options: {media: imagini}}
              - {name: alt, label: "Descriere poza", type: string}
              - {name: sus, label: "Poza de sus a paginii (se incarca prima)", type: boolean}
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: text
            fields:
              - {name: titlu, label: Titlu, type: string}
              - name: paragrafe
                label: Paragrafe
                type: object
                list: true
                fields:
                  - {name: text, label: Paragraf, type: text}
              - name: butoane
                label: "Butoane (se pot muta prin tragere)"
                type: object
                list: true
                fields:
                  - {name: text, label: "Text pe buton", type: string}
                  - {name: link, label: "Link (ex. contact.html, servicii.html, tel:+40..., sau link complet)", type: string}
                  - {name: contur, label: "Buton cu contur, fara fundal colorat", type: boolean}
                  - {name: culoare, label: "Culoare buton (optional, ex. #c0207a; gol = culoarea site-ului)", type: string}
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: valori
            fields:
              - {name: titlu, label: Titlu, type: string}
              - name: elemente
                label: "Elemente (pictogramele se pun automat, in ordine)"
                type: object
                list: true
                fields:
                  - {name: titlu, label: Titlu, type: string}
                  - {name: text, label: Text, type: text}
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: campanie
            fields:
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: clipuri
            fields:
              - {name: titlu, label: "Titlu (gol = Clipuri video); arata toate clipurile din 'Clipuri video'", type: string}
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}

  - name: despre
    label: "Despre noi (sectiuni, text, butoane)"
    type: file
    path: _data/despre.yml
    format: yaml
    fields:
      - name: sectiuni
        label: "Sectiuni pagina (trage de ⋮⋮ ca sa le muti; sterge ca sa le ascunzi; 'Add' ca sa adaugi)"
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {tip} {titlu}"
        blockKey: tip
        blocks:
          - name: poveste
            fields:
              - {name: titlu, label: Titlu, type: string}
              - {name: eticheta, label: "Eticheta ingrosata (ex. Pe scurt:)", type: string}
              - {name: pe_scurt, label: "Textul de dupa eticheta", type: text}
              - name: paragrafe
                label: Paragrafe
                type: object
                list: true
