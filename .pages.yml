              - {name: sus, label: "Poza de sus a paginii (se incarca prima)", type: boolean}
              - {name: fundal_alt, label: "Fundal roz deschis (bifat) sau alb", type: boolean}
              - {name: culoare_fundal, label: "Culoare fundal sectiune (optional, ex. #fde7f3; gol = ca acum)", type: string}
              - {name: culoare_titlu, label: "Culoare titlu sectiune (optional, ex. #c0207a; gol = ca acum)", type: string}
          - name: text
            fields:
              - {name: titlu, label: Titlu, type: string}
              - name: paragrafe
                label: Paragrafe
                type: object
                list: true
                fields:
                  - {name: text, label: Paragraf, type: text}
              - name: butoane
                label: "Butoane (se pot muta prin tragere)"
                type: object
                list: true
                fields:
                  - {name: text, label: "Text pe buton", type: string}
