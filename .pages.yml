media:
  - name: galerie
    label: Poze galerie
    input: img/galerie
    output: img/galerie
    extensions: [webp, jpg, jpeg, png]
    rename: safe

content:
  - name: galerie
    label: Galerie
    type: file
    path: galerie.json
    format: json
    fields:
      - name: poze
        label: Poze
        type: object
        list: true
        fields:
          - name: src
            label: Poza
            type: image
            options:
              media: galerie
          - name: alt
            label: Descriere poza
            type: string
          - name: legenda
            label: Legenda (optional)
            type: string
          - name: w
            label: Latime (px)
            type: number
          - name: h
            label: Inaltime (px)
            type: number

  - name: preturi
    label: Preturi
    type: file
    path: _data/preturi.yml
    format: yaml
    fields:
      - name: complet
        label: Pachet complet (lei)
        type: object
        fields:
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}
      - name: spalat
        label: Doar spalat (lei)
        type: object
        fields:
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}
      - name: tuns
        label: Doar tuns (lei)
        type: object
        fields:
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}
