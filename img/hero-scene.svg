<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">Doi catelusi toaletati pe masa de toaletaj</title>
  <desc id="d">Ilustratie cu un bichon alb si un catel crem cu fundita roz, inconjurati de bule de sapun si lighioane de labute.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffd6ec"/><stop offset="1" stop-color="#ffeef7"/>
    </radialGradient>
    <linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6399b"/><stop offset="1" stop-color="#c2237d"/>
    </linearGradient>
    <g id="paw" fill="#e6399b">
      <ellipse cx="0" cy="6" rx="9" ry="7.5"/>
      <ellipse cx="-11" cy="-5" rx="3.6" ry="4.6"/>
      <ellipse cx="-4" cy="-10" rx="3.6" ry="4.8"/>
      <ellipse cx="4" cy="-10" rx="3.6" ry="4.8"/>
      <ellipse cx="11" cy="-5" rx="3.6" ry="4.6"/>
    </g>
    <g id="bubble">
      <circle r="1" fill="none"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="640" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="560" cy="80" r="70" fill="#ffc2e2" opacity=".55"/>
  <circle cx="70" cy="440" r="90" fill="#ffc2e2" opacity=".45"/>

  <!-- paws -->
  <use href="#paw" transform="translate(70 90) rotate(-18) scale(1.5)" opacity=".35"/>
  <use href="#paw" transform="translate(575 330) rotate(16) scale(1.3)" opacity=".35"/>
  <use href="#paw" transform="translate(520 470) rotate(-8) scale(.9)" opacity=".3"/>

  <!-- bubbles -->
  <g fill="#fff" fill-opacity=".7" stroke="#e6399b" stroke-opacity=".5" stroke-width="2.5">
    <circle cx="120" cy="170" r="22"/><circle cx="170" cy="120" r="12"/>
    <circle cx="470" cy="140" r="26"/><circle cx="520" cy="200" r="13"/>
    <circle cx="90" cy="260" r="10"/><circle cx="545" cy="270" r="9"/>
  </g>
  <g fill="#e6399b" fill-opacity=".5">
    <circle cx="112" cy="163" r="5"/><circle cx="462" cy="132" r="6"/>
  </g>

  <!-- table -->
  <rect x="60" y="388" width="520" height="34" rx="17" fill="url(#tbl)"/>
  <rect x="95" y="418" width="14" height="70" rx="6" fill="#17121a"/>
  <rect x="531" y="418" width="14" height="70" rx="6" fill="#17121a"/>
  <ellipse cx="320" cy="500" rx="250" ry="12" fill="#c2237d" opacity=".15"/>

  <!-- dog A: bichon -->
  <g stroke="#17121a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- body -->
    <ellipse cx="205" cy="330" rx="78" ry="54" fill="#fff"/>
    <ellipse cx="150" cy="378" rx="22" ry="14" fill="#fff"/>
    <ellipse cx="248" cy="380" rx="22" ry="14" fill="#fff"/>
    <!-- head fluff -->
    <g fill="#fff">
      <circle cx="205" cy="215" r="72"/>
      <circle cx="152" cy="190" r="34"/><circle cx="258" cy="190" r="34"/>
      <circle cx="170" cy="150" r="30"/><circle cx="240" cy="150" r="30"/><circle cx="205" cy="140" r="32"/>
      <circle cx="140" cy="240" r="34"/><circle cx="270" cy="240" r="34"/>
    </g>
    <circle cx="205" cy="215" r="70" fill="#fff" stroke="none"/>
    <!-- face -->
    <circle cx="180" cy="215" r="8" fill="#17121a" stroke="none"/>
    <circle cx="230" cy="215" r="8" fill="#17121a" stroke="none"/>
    <circle cx="183" cy="212" r="2.6" fill="#fff" stroke="none"/>
    <circle cx="233" cy="212" r="2.6" fill="#fff" stroke="none"/>
    <ellipse cx="205" cy="243" rx="12" ry="9" fill="#17121a"/>
    <path d="M205 252 v8 M192 262 q13 12 26 0" fill="none"/>
    <path d="M199 266 q6 14 12 0" fill="#ff7fb8" stroke="#17121a"/>
    <!-- blush -->
    <circle cx="160" cy="240" r="9" fill="#ffb6d8" stroke="none" opacity=".8"/>
    <circle cx="250" cy="240" r="9" fill="#ffb6d8" stroke="none" opacity=".8"/>
  </g>

  <!-- dog B: cream pup with bow -->
  <g stroke="#17121a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="440" cy="336" rx="66" ry="50" fill="#f8e6c8"/>
    <ellipse cx="398" cy="380" rx="19" ry="13" fill="#f8e6c8"/>
    <ellipse cx="478" cy="380" rx="19" ry="13" fill="#f8e6c8"/>
    <!-- ears -->
    <path d="M392 238 q-40 10 -34 70 q4 28 30 18 q16 -40 14 -88z" fill="#b9803f"/>
    <path d="M488 238 q40 10 34 70 q-4 28 -30 18 q-16 -40 -14 -88z" fill="#b9803f"/>
    <!-- head -->
    <circle cx="440" cy="232" r="60" fill="#f8e6c8"/>
    <path d="M440 176 q-28 6 -34 36 q20 -4 34 -2 q14 -2 34 2 q-6 -30 -34 -36z" fill="#fff" stroke="none"/>
    <!-- face -->
    <circle cx="418" cy="236" r="7" fill="#17121a" stroke="none"/>
    <circle cx="462" cy="236" r="7" fill="#17121a" stroke="none"/>
    <circle cx="420.5" cy="233.5" r="2.3" fill="#fff" stroke="none"/>
    <circle cx="464.5" cy="233.5" r="2.3" fill="#fff" stroke="none"/>
    <ellipse cx="440" cy="258" rx="10" ry="7.5" fill="#17121a"/>
    <path d="M440 265 v6 M429 273 q11 10 22 0" fill="none"/>
    <!-- bow -->
    <path d="M440 168 l-26 -18 q-10 18 0 34z" fill="#e6399b"/>
    <path d="M440 168 l26 -18 q10 18 0 34z" fill="#e6399b"/>
    <circle cx="440" cy="168" r="8" fill="#c2237d"/>
  </g>

  <!-- scissors -->
  <g transform="translate(300 88) rotate(-25)" fill="none" stroke="#17121a" stroke-width="4" stroke-linecap="round">
    <circle cx="-16" cy="26" r="11" stroke="#e6399b"/>
    <circle cx="16" cy="26" r="11" stroke="#e6399b"/>
    <path d="M-12 17 L16 -34 M12 17 L-16 -34"/>
  </g>

  <!-- sparkles -->
  <g fill="#e6399b">
    <path d="M330 300 l4 -12 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4z" transform="translate(-6 -10) scale(.9)"/>
    <path d="M560 392 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z"/>
    <path d="M52 330 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z"/>
  </g>
</svg>
