media:
  - name: galerie
    label: Poze galerie
    input: img/galerie
    output: img/galerie
    extensions: [webp, jpg, jpeg, png]
    rename: safe
  - name: clipuri
    label: Clipuri video
    input: video
    output: video
    extensions: [mp4, webm]
    rename: safe
  - name: imagini
    label: Imagini site
    input: img/site
    output: img/site
    extensions: [webp, jpg, jpeg, png, svg]
    rename: safe

content:
  - name: galerie
    label: Galerie
    type: file
    path: galerie.json
    format: json
    fields:
      - name: poze
        label: Poze
        type: object
        list: true
        fields:
          - name: src
            label: Poza
            type: image
            options:
              media: galerie
          - name: alt
            label: Descriere poza
            type: string
          - name: legenda
            label: Legenda (optional)
            type: string
          - name: w
            label: Latime (px)
            type: number
          - name: h
            label: Inaltime (px)
            type: number

  - name: preturi
    label: Preturi
    type: file
    path: _data/preturi.yml
    format: yaml
    fields:
      - name: complet
        label: Pachet complet (lei)
        type: object
        fields:
          - {name: descriere, label: Descriere (ce include), type: text}
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}
      - name: spalat
        label: Doar spalat (lei)
        type: object
        fields:
          - {name: descriere, label: Descriere (ce include), type: text}
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}
      - name: tuns
        label: Doar tuns (lei)
        type: object
        fields:
          - {name: descriere, label: Descriere (ce include), type: text}
          - {name: mica, label: Talie mica, type: number}
          - {name: medie, label: Talie medie, type: number}
          - {name: mare, label: Talie mare, type: number}

  - name: salon
    label: Telefon si program
    type: file
    path: _data/salon.yml
    format: yaml
    fields:
      - name: telefon
        label: Telefon afisat (ex. 0791 140 396)
        type: string
      - name: telefon_intl
        label: Telefon pentru link-uri (ex. +40791140396)
        type: string
      - name: program
        label: Program
        type: object
        fields:
          - {name: luni_vineri_de, label: "Luni-Vineri: deschidere (HH:MM, ex. 09:00)", type: string}
          - {name: luni_vineri_pana, label: "Luni-Vineri: inchidere (HH:MM, ex. 17:00)", type: string}
          - {name: sambata_de, label: "Sambata: deschidere (HH:MM)", type: string}
          - {name: sambata_pana, label: "Sambata: inchidere (HH:MM)", type: string}
      - {name: strada, label: "Adresa: strada si numar", type: string}
      - {name: detalii_adresa, label: "Adresa: bloc, scara, parter", type: string}
      - {name: oras, label: Oras, type: string}
      - {name: cod_postal, label: "Cod postal", type: string}
      - {name: facebook, label: "Link Facebook (complet, cu https://)", type: string}
      - {name: instagram, label: "Link Instagram (complet, cu https://)", type: string}
      - {name: tiktok, label: "Link TikTok (complet, cu https://)", type: string}
      - {name: text_subsol, label: "Text scurt din subsolul paginilor", type: string}

  - name: video
    label: Clipuri video
    type: file
    path: _data/video.yml
    format: yaml
    fields:
      - name: clipuri
        label: Clipuri
        type: object
        list: true
        fields:
          - {name: titlu, label: "Titlu (optional)", type: string}
          - {name: link, label: "Link complet TikTok / Facebook / Instagram (copiat din browser)", type: string}
          - name: fisier
            label: "SAU fisier video incarcat (mp4 sau webm, sub 25 MB)"
            type: file
            options: {media: clipuri}
          - name: poza
            label: "Coperta pentru fisier (optional)"
            type: image
            options: {media: galerie}

  - name: recenzii
    label: Recenzii (Ce spun clientii)
    type: file
    path: _data/recenzii.yml
    format: yaml
    fields:
      - {name: nota, label: "Nota pe Google (ex. 4,9)", type: string}
      - {name: numar, label: "Numar de recenzii", type: number}
      - {name: luna, label: "Luna si anul notei (ex. octombrie 2026)", type: string}
      - {name: link, label: "Link catre recenziile de pe Google Maps", type: string}
      - name: recenzii
        label: Recenzii afisate pe site
        type: object
        list: true
        fields:
          - {name: text, label: "Textul recenziei (fara ghilimele)", type: text}
          - {name: autor, label: "Autor (ex. M. U., recenzie Google)", type: string}

  - name: campanie
    label: Campanie (Secret Santa)
    type: file
    path: _data/campanie.yml
    format: yaml
    fields:
      - {name: afisata, label: "Afiseaza campania pe site (pagina principala si Despre noi)", type: boolean}
      - name: imagine
        label: "Imaginea din dreptul textului (svg, png sau webp)"
        type: image
        options: {media: imagini}
      - {name: eticheta, label: "Eticheta mica de deasupra titlului", type: string}
      - {name: titlu, label: Titlu, type: string}
      - {name: text, label: Text, type: text}

  - name: faq
    label: Intrebari frecvente
    type: file
    path: _data/faq.yml
    format: yaml
    fields:
      - name: intrebari
        label: Intrebari
        type: object
        list: true
        fields:
          - {name: intrebare, label: Intrebare, type: string}
          - {name: raspuns, label: "Raspuns (poti scrie [preturi] pentru textul cu preturile si [telefon] pentru numarul de telefon, se completeaza automat)", type: text}
          - {name: pe_prima_pagina, label: "Arata si pe pagina principala (pe Servicii apar toate)", type: boolean}

  - name: acasa
    label: Pagina principala (titlu si text de sus)
    type: file
    path: _data/acasa.yml
    format: yaml
    fields:
      - {name: titlu, label: "Titlu mare", type: string}
      - {name: lead, label: "Text sub titlu", type: text}
      - {name: servicii_titlu, label: "Ce face salonul: titlul sectiunii", type: string}
      - {name: servicii_text, label: "Ce face salonul: text sub titlu", type: text}
      - name: servicii
        label: "Ce face salonul: lista (pictogramele se pun automat, in ordine)"
        type: object
        list: true
        fields:
          - {name: titlu, label: Titlu, type: string}
          - {name: text, label: Text, type: text}
      - {name: pasi_titlu, label: "Cum decurge o programare: titlul sectiunii", type: string}
      - name: pasi
        label: "Cum decurge o programare: pasii (poti scrie [telefon] pentru numarul de telefon)"
        type: object
        list: true
        fields:
          - {name: titlu, label: Titlu, type: string}
          - {name: text, label: Text, type: text}

  - name: despre
    label: Despre noi (poveste si valori)
    type: file
    path: _data/despre.yml
    format: yaml
    fields:
      - {name: pe_scurt, label: "Textul dupa 'Pe scurt:'", type: text}
      - name: paragrafe
        label: Paragrafe urmatoare
        type: object
        list: true
        fields:
          - {name: text, label: Paragraf, type: text}
      - name: valori
        label: "Ce ne ghideaza (pictogramele se pun automat, in ordine)"
        type: object
        list: true
        fields:
          - {name: titlu, label: Titlu, type: string}
          - {name: text, label: Text, type: text}

  - name: reguli
    label: "Reguli de citit inainte de programare (Servicii si Contact)"
    type: file
    path: _data/reguli.yml
    format: yaml
    fields:
      - name: reguli
        label: Reguli
        type: object
        list: true
        fields:
          - {name: text, label: Regula, type: text}

  - name: imagini
    label: Imagini principale (banner, colaje, poza din Despre noi)
    type: file
    path: _data/imagini.yml
    format: yaml
    fields:
      - name: banner
        label: "Banner (Acasa, Despre noi, Galerie)"
        type: object
        fields:
          - {name: poza, label: Poza, type: image, options: {media: imagini}}
          - {name: alt, label: "Descriere poza (pentru cei care nu o vad)", type: string}
      - name: inainte_dupa
        label: "Colaj 'Inainte si dupa' (Acasa)"
        type: object
        fields:
          - {name: poza, label: Poza, type: image, options: {media: imagini}}
          - {name: alt, label: "Descriere poza", type: string}
      - name: colaj
        label: "Colaj de pe canapea (Despre noi)"
        type: object
        fields:
          - {name: poza, label: Poza, type: image, options: {media: imagini}}
          - {name: alt, label: "Descriere poza", type: string}
      - name: despre
        label: "Poza de langa poveste (Despre noi)"
        type: object
        fields:
          - {name: poza, label: Poza, type: image, options: {media: imagini}}
          - {name: alt, label: "Descriere poza", type: string}

  - name: culori
    label: Culori site
    type: file
    path: _data/culori.yml
    format: yaml
    fields:
      - {name: pink, label: "Culoare principala (butoane, accente) - ex. #e6399b", type: string}
      - {name: pink_dark, label: "Culoare principala inchisa (linkuri, titluri colorate)", type: string}
      - {name: pink_deep, label: "Culoare principala foarte inchisa (hover)", type: string}
      - {name: pink_darkest, label: "Culoare inchisa (capat de degrade, sus si jos)", type: string}
      - {name: pink_soft, label: "Roz deschis (etichete, fundaluri mici)", type: string}
      - {name: pink_line, label: "Roz pentru linii si borduri", type: string}
      - {name: pink_glow, label: "Roz pentru degrade (sus)", type: string}
      - {name: pink_glow_2, label: "Roz pentru degrade (jos)", type: string}
      - {name: on_pink, label: "Text deschis pe fundal colorat", type: string}
      - {name: ink, label: "Culoare titluri", type: string}
      - {name: text, label: "Culoare text", type: string}
      - {name: muted, label: "Culoare text secundar", type: string}
      - {name: bg, label: "Fundal pagina", type: string}
      - {name: alt, label: "Fundal sectiuni alternante", type: string}
