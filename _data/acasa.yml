titlu: "Rasfat si grija - catelul tau merita tot ce e mai bun"
lead: "Tuns, spalat, uscat, periat, curatat urechi si taiat unghii, cu rabdare si grija pentru fiecare blanos."
servicii_titlu: "Ce face salonul pentru catelusul tau"
servicii_text: "La fiecare sedinta, in functie de pachetul ales, ai parte de aceste ingrijiri."
servicii:
  - titlu: "Tuns"
    text: "Tuns adaptat tipului de blana si cerintelor tale."
  - titlu: "Spalat"
    text: "Baie cu grija, ca blana sa ramana curata si placuta la atingere."
  - titlu: "Uscat"
    text: "Uscat atent, inainte de periat si aranjat."
  - titlu: "Periat"
    text: "Periat pentru o blana aranjata si fara noduri."
  - titlu: "Curatat urechi"
    text: "Urechile sunt curatate la fiecare sedinta."
  - titlu: "Taiat unghii"
    text: "Unghii taiate la fiecare sedinta, ca mersul sa fie confortabil."
pasi_titlu: "Cum decurge o programare"
pasi:
  - titlu: "Ne suni sau ne scrii"
    text: "Pe [telefon] sau pe WhatsApp. Ne spui rasa si talia cainelui."
  - titlu: "Stabilim ziua si ora"
    text: "Alegem impreuna intervalul care ti se potriveste."
  - titlu: "Te anuntam cand e gata"
    text: "Daca ai lasat cainele la salon, te sunam cand poti sa-l iei."

sectiuni:
